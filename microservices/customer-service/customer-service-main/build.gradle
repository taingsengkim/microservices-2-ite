plugins {
    id 'spring-boot-common-conventions'
    id 'spring-cloud-common-conventions'
}

dependencies {

    implementation 'org.springframework.cloud:spring-cloud-starter-consul-discovery'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'kh.edu.istad:customer-domain-core:1.1'
    implementation 'kh.edu.istad:customer-application-service'
    implementation 'kh.edu.istad:customer-service-message'
    implementation 'kh.edu.istad:customer-service-persistence'
    implementation 'kh.edu.istad:customer-service-restapi'

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    implementation libs.springdoc.openapi.starter.webmvc.ui
}
dependencies {
    implementation 'kh.edu.istad:grpc-contract:1.0.0'
    implementation platform('io.grpc:grpc-bom:1.83.1')
    implementation 'io.grpc:grpc-netty-shaded'
}

dependencies {
    testImplementation 'io.grpc:grpc-inprocess:1.83.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
